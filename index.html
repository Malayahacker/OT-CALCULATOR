<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OT Calculator Pro</title>
    <link rel="stylesheet" href="style.css">
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3067/3067343.png">

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(() => console.log('App Ready Offline!'))
            .catch((err) => console.log('PWA Error:', err));
        });
      }
    </script>
</head>
<body>

<div class="calculator-card">
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle Theme">🌙</button>

    <h2>OT Pay Calculator</h2>
    
    <div class="input-group">
        <label for="grossSalary">Gaji Pokok / Gaji Kasar (RM)</label>
        <input type="number" id="grossSalary" value="0" min="0" step="0.01">
        <div class="info-text">Masukkan jumlah kasar (Basic + Elaun Tetap jika ada).</div>
    </div>

    <div class="input-group">
        <label for="otRate">Jenis Hari / OT (Rate)</label>
        <div class="select-wrapper">
            <select id="otRate">
                <option value="1.5" data-default-hours="10.5">Normal Day & Off Day (1.5)</option>
                <option value="2.0" data-default-hours="8.0">Rest Day (2.0)</option>
                <option value="3.0" data-default-hours="2.5">Public Holiday Full Day (3.0)</option>
                <option value="2.0" data-default-hours="2.5">Public Holiday Half Day (2.0)</option>
            </select>
        </div>
    </div>

    <div class="input-group">
        <label for="otHours">OT Hours (Jam Kerja OT)</label>
        <input type="number" id="otHours" value="10.5" min="0" step="0.1">
        <div class="info-text" id="hoursHelpText">Default jam dikemas kini automatik ikut jenis hari.</div>
    </div>

    <div class="results-container">
        <div class="result-row">
            <span class="label-text">Kadar Sejam Asas:</span>
            <span id="hourlyRate" class="value-text">RM 0.00</span>
        </div>
        <div class="result-row">
            <span class="label-text">Kadar Selepas Gandaan:</span>
            <span id="appliedRate" class="value-text-sub">1.5x (RM 0.0000)</span>
        </div>
        <div class="result-row total">
            <span class="label-text-total">Jumlah Bayaran OT:</span>
            <span id="totalOT" class="value-text-total">RM 0.00</span>
        </div>
    </div>

    <div class="developer-footer">
        Developed by <span>Wan Mustaqim</span>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
